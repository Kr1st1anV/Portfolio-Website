<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristian Velazquez | 3D Graphics Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js + OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: sans-serif; }
        #webgl-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body class="text-slate-200">

    <!-- OVERLAY NAV -->
    <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-10 pointer-events-none">
        <a href="index.html" class="pointer-events-auto bg-slate-900/80 backdrop-blur border border-slate-800 text-xs font-mono px-4 py-2 rounded text-slate-300 hover:text-white hover:border-slate-600 transition-all flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Return to Portfolio</span>
        </a>
        
        <div class="bg-slate-900/80 backdrop-blur border border-slate-800 text-[11px] font-mono px-3 py-1.5 rounded text-blue-400">
            WebGL 3D Spatial Vision Sandbox
        </div>
    </div>

    <!-- OVERLAY CONTROLS / INFO -->
    <div class="absolute bottom-6 left-6 z-10 pointer-events-none max-w-sm">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-800 p-4 rounded text-xs space-y-2 pointer-events-auto">
            <div class="font-mono text-white font-medium flex items-center justify-between">
                <span>Spatial Point-Cloud Simulation</span>
                <span class="text-[10px] text-emerald-400 font-mono">60 FPS</span>
            </div>
            <p class="text-slate-400 text-[11px] leading-relaxed">
                Interactive wireframe geometry and particle field simulating SpatialCAD landmark tracking nodes. Left-click to rotate, scroll to zoom, right-click to pan.
            </p>
        </div>
    </div>

    <!-- CANVAS CONTAINER -->
    <div id="webgl-container"></div>

    <script>
        lucide.createIcons();

        // SCENE SETUP
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // GEOMETRY 1: WIREFRAME ICOSAHEDRON (SPATIAL NODE CORE)
        const icoGeo = new THREE.IcosahedronGeometry(2, 2);
        const icoMat = new THREE.MeshBasicMaterial({ 
            color: 0x3b82f6, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.6 
        });
        const icoMesh = new THREE.Mesh(icoGeo, icoMat);
        scene.add(icoMesh);

        // GEOMETRY 2: INNER CORE MESH
        const innerGeo = new THREE.IcosahedronGeometry(1.2, 1);
        const innerMat = new THREE.MeshBasicMaterial({ 
            color: 0x60a5fa, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.9 
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerMesh);

        // GEOMETRY 3: PARTICLE FIELD (ASTROPHYSICS / TRACKING POINTS)
        const particlesCount = 1500;
        const positions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 25;
            positions[i+1] = (Math.random() - 0.5) * 25;
            positions[i+2] = (Math.random() - 0.5) * 25;
        }

        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.035,
            color: 0x94a3b8,
            transparent: true,
            opacity: 0.5
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // GRID FLOOR
        const gridHelper = new THREE.GridHelper(30, 30, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -3;
        scene.add(gridHelper);

        // ANIMATION LOOP
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate core elements
            icoMesh.rotation.x = elapsedTime * 0.15;
            icoMesh.rotation.y = elapsedTime * 0.2;

            innerMesh.rotation.x = -elapsedTime * 0.25;
            innerMesh.rotation.y = -elapsedTime * 0.3;

            // Slowly orbit particles
            particleSystem.rotation.y = elapsedTime * 0.03;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // RESIZE HANDLER
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
