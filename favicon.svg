<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Dark Slate Badge -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  
  <!-- Subtle Border Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="16" />

  <!-- Planetary Orbit Ring -->
  <g transform="rotate(-30, 256, 256)">
    <ellipse cx="256" cy="256" rx="190" ry="55" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Central Planet Sphere -->
  <circle cx="256" cy="256" r="105" fill="#0f172a" stroke="#38bdf8" stroke-width="12" />

  <!-- Orbiting Moon / Satellite Accent -->
  <circle cx="390" cy="165" r="16" fill="#60a5fa" />

  <!-- Code Brackets <> Inside Planet -->
  <text 
    x="50%" 
    y="53%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" 
    font-size="110" 
    font-weight="800" 
    fill="#f8fafc" 
    letter-spacing="-2"
  >&lt;&gt;</text>
</svg>
